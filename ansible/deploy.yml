---
- name: Configure Logistics Server
  hosts: logistics
  become: yes

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Start Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Run logistics container
      docker_container:
        name: logistics-app
        image: your-dockerhub-username/logistics-app:latest
        state: started
        restart_policy: always
        ports:
          - "1919:1919"
        env:
          SPRING_DATASOURCE_URL: "jdbc:mysql://YOUR_RDS_ENDPOINT:3306/logistics"
          SPRING_DATASOURCE_USERNAME: "admin"
          SPRING_DATASOURCE_PASSWORD: "root12345"